# v0.4 – 2026-10-21: önce Fare eklentisi derlenip TvGonder'in içine gömülür (internetten indirme gerekmez), sonra TvGonder derlenir; ikisi Releases'a konur
name: APK derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK derle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          # 1) Fare eklentisi → 2) TvGonder'in içine (assets) → 3) TvGonder
          { gradle :fare:assembleDebug --no-daemon && mkdir -p app/src/main/assets && \
            cp fare/build/outputs/apk/debug/fare-debug.apk app/src/main/assets/TvGonderFare.apk && \
            gradle :app:assembleDebug --no-daemon; } 2>&1 | tee build.log || {
            grep -E "^e: |error:|ERROR:|What went wrong" -A3 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: APK adını düzenle
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TvGonder-${{ github.run_number }}.apk
          cp fare/build/outputs/apk/debug/fare-debug.apk TvGonderFare.apk

      - name: Sürüm sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: TV Gönder – derleme ${{ github.run_number }}
          body: "TvGonder: telefon, TV ve tablete. TvGonderFare: sadece TV/tablete (fare için). Commit: ${{ github.sha }}"
          files: |
            TvGonder-${{ github.run_number }}.apk
            TvGonderFare.apk
